# Ages bases allow a wider layout, including the inherited starting Gathering Hub.
^BasicBuilding:
	RequiresBuildableArea:
		Adjacent: 6

FACT:
	BaseProvider:
		Range: 24c0

# Medieval melee prototype, available from either faction's barracks.
PIKEMAN:
	Inherits: ^Soldier
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Medieval
		BuildAtProductionType: Soldier
		BuildPaletteOrder: 15
		Prerequisites: mbarracks
		Description: actor-pikeman.description
	Valued:
		Cost: 40
	Tooltip:
		Name: actor-pikeman.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 8000
	Mobile:
		Speed: 62
	Armament:
		Weapon: PikeThrust
	WithInfantryBody:
		StandSequences: stand
		IdleSequences: idle
		DefaultAttackSequence: stab
		RequiresCondition: !parachute
	WithInfantryBody@PARACHUTE:
		StandSequences: stand
		RequiresCondition: parachute
	AutoTarget:
		ScanRadius: 5
		InitialStance: AttackAnything
	Selectable:
		Bounds: 1195,1451,0,-512
	-TakeCover:

ARCHER:
	Inherits: PIKEMAN
	Buildable:
		BuildPaletteOrder: 20
		Description: ages-archer-desc
	Tooltip:
		Name: ages-archer
	Valued:
		Cost: 60
	Health:
		HP: 4500
	Armament:
		Weapon: MedievalArrow
	WithInfantryBody:
		DefaultAttackSequence: attack

RIDER:
	Inherits: PIKEMAN
	Buildable:
		BuildPaletteOrder: 30
		Description: ages-rider-desc
	Tooltip:
		Name: ages-rider
	Valued:
		Cost: 140
	Health:
		HP: 18000
	Mobile:
		Speed: 120
	Armament:
		Weapon: CavalryLance
	WithInfantryBody:
		DefaultAttackSequence: attack
	Selectable:
		Bounds: 1451,1707,0,-683
		DecorationBounds: 1024,1280,0,-597

WORKER:
	Selectable:
		Bounds: 1195,1195,0,-427
	Inherits: ^Infantry
	Inherits@selection: ^SelectableEconomicUnit
	Tooltip:
		Name: ages-worker
	Valued:
		Cost: 80
	Health:
		HP: 6000
	Mobile:
		Speed: 72
	Harvester:
		Resources: Ore,Gems
		BaleLoadDelay: 160
		BaleUnloadDelay: 1
		SearchFromProcRadius: 24
		SearchFromHarvesterRadius: 12
		HarvestFacings: 8
	StoresResources:
		Capacity: 2
		Resources: Ore,Gems
	DockClientManager:
	SoundOnHarvest:
		SoundFiles: ages-pick-1.wav, ages-pick-2.wav
		Interval: 120
	WithHarvestAnimation:
	-WithInfantryBody:
	WithFacingSpriteBody:
		Sequence: stand
	WithMoveAnimation:
		MoveSequence: run
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		Margin: 4,3
		RequiresSelection: true
		PipCount: 2
		ResourceSequences:
			Ore: pip-yellow
			Gems: pip-red

GUNPOWDER.AGE:
	Interactable:
	ScriptTriggers:
	Tooltip:
		Name: ages-gunpowder-upgrade
	Buildable:
		Queue: Research
		BuildAtProductionType: Research
		BuildPaletteOrder: 1
		Prerequisites: mbarracks, mhut, ~!gunpowder.age
		BuildLimit: 1
		BuildDuration: 750
		BuildDurationModifier: 100
		Description: ages-gunpowder-upgrade-desc
	Valued:
		Cost: 1800
	RenderSprites:
		Image: musketeer
	ProvidesPrerequisite:
		Prerequisite: gunpowder.age

MODERN.AGE:
	Interactable:
	ScriptTriggers:
	Tooltip:
		Name: ages-upgrade
	Buildable:
		Queue: Research
		BuildAtProductionType: Research
		BuildPaletteOrder: 99
		Prerequisites: mbarracks, mhut, ~gunpowder.age, ~!modern.age
		BuildLimit: 1
		BuildDuration: 1250
		BuildDurationModifier: 100
		Description: ages-upgrade-desc
	Valued:
		Cost: 4500
	RenderSprites:
		Image: fact
	ProvidesPrerequisite:
		Prerequisite: modern.age

MBARRACKS:
	Inherits: TENT
	Buildable:
		Prerequisites: mhut
		Description: ages-barracks-desc
		BuildPaletteOrder: 1
	Valued:
		Cost: 200
	Tooltip:
		Name: ages-barracks
	RenderSprites:
		Image: mbarracks
	-WithBuildingBib:
	Power:
		Amount: 0
	Production:
		Produces: Infantry, Medieval, Gunpowder, Soldier, Research
	ProvidesPrerequisite@medieval:
		Prerequisite: mbarracks
	SpawnActorsOnSell:
		ActorTypes: worker
		GuaranteedActorTypes: worker

MHUT:
	Inherits: FACT
	Buildable:
		Prerequisites: mhut
		Description: ages-hut-desc
		BuildDuration: 750
		BuildDurationModifier: 100
		BuildPaletteOrder: 2
	Valued:
		Cost: 600
	Tooltip:
		Name: ages-hut
	Health:
		HP: 60000
	RenderSprites:
		Image: mhut
	-WithBuildingBib:
	Power:
		Amount: 100
	Production:
		Produces: Building, Defense
	FreeActor@GATHERER1:
		Actor: worker
		SpawnOffset: 0,3
		RequiresCondition: !build-incomplete
	FreeActor@GATHERER2:
		Actor: worker
		SpawnOffset: 1,3
		RequiresCondition: !build-incomplete
	FreeActor@GATHERER3:
		Actor: worker
		SpawnOffset: 2,3
		RequiresCondition: !build-incomplete
	RallyPoint:
	Refinery:
	DockHost:
		Type: Unload
		DockOffset: 0,2c0,0
	StoresPlayerResources:
		Capacity: 5000
	ProvidesPrerequisite@hut:
		Prerequisite: mhut
	-SpawnActorsOnSell:
	-Transforms:
	-TransformsIntoMobile:
	-TransformsIntoPassenger:
	-TransformsIntoRepairable:
	-TransformsIntoTransforms:
	-GrantConditionOnPrerequisite@GLOBALFACTUNDEPLOY:
	-ConyardChronoReturn:
	ExternalCondition@CHRONO:
		Condition: chrono-vortex
	-TransferTimedExternalConditionOnTransform:

MHUT.START:
	Inherits: MHUT
	-FreeActor@GATHERER1:
	-FreeActor@GATHERER2:
	-FreeActor@GATHERER3:
	-Buildable:
	FreeActor@STARTBARRACKS:
		Actor: mbarracks
		SpawnOffset: -4,0
	ProvidesPrerequisite@buildingname:
		Prerequisite: mhut

World:
	-StartingUnits@mcvonly:
	-StartingUnits@lightallies:
	-StartingUnits@lightsoviet:
	-StartingUnits@heavyallies:
	-StartingUnits@heavysoviet:
	StartingUnits@ages:
		Class: ages
		ClassName: ages-starting-army
		Factions: allies, england, france, germany, soviet, russia, ukraine
		BaseActor: mhut.start
		SupportActors: worker,worker,worker
		InnerSupportRadius: 4
		OuterSupportRadius: 7
	SpawnStartingUnits:
		StartingUnitsClass: ages
		DropdownLocked: true

Player:
	ClassicProductionQueue@Building:
		SpeedUp: false
	ClassicProductionQueue@Research:
		Type: Research
		DisplayOrder: 3
		ReadyAudio: NewOptions
		QueuedAudio: Building
	ClassicProductionQueue@Medieval:
		Type: Medieval
		DisplayOrder: 4
		ReadyAudio: UnitReady
		QueuedAudio: Training
	ClassicProductionQueue@Gunpowder:
		Type: Gunpowder
		DisplayOrder: 5
		ReadyAudio: UnitReady
		QueuedAudio: Training
	GrantConditionOnPrerequisite@GUNPOWDER:
		Condition: gunpowder-age
		Prerequisites: gunpowder.age
	PlayerResources:
		DefaultCash: 500
		SelectableCash: 500,1000,3000,5000
	GrantConditionOnPrerequisite@AGE:
		Condition: modern-age
		Prerequisites: modern.age

MUSKETEER:
